name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Typecheck first: it catches the class of breakage (a deleted component
      # still imported by a layout) that previously reached the deploy.
      - run: npm run typecheck
      - run: npm run lint

      # Before the build, so a data regression (a price key that matches no
      # branch, a duplicated category slug) fails in seconds rather than after
      # a full production build.
      - run: npm run test

      - run: npm run build

      # Starts the built site and loads every page in every language, failing
      # on any word carrying a letter that language does not have. A missed
      # translation is invisible to typecheck, lint and tests alike.
      - name: Check every page renders in the selected language
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 60000
          npm run check:locales
